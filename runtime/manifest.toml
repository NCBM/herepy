# jep is what puts CPython inside the JVM, and it is the one thing here that cannot be pinned as a binary:
# PyPI publishes it as an sdist only, so it has to be compiled against this very runtime — which is why
# ADR 0011 records a toolchain, not a wheel. Until its build is a step this task performs, a `jep` already
# in the runtime is carried across a re-materialization and a missing one is reported, because a runtime
# without it cannot start Python at all.
[build.jep]
version = "4.4.0"
sdist = "https://files.pythonhosted.org/packages/f7/4f/e73ab939b0a7aa54c1c56e5425a51a8e6dd03e77e768341b62e5d6a67992/jep-4.4.0.tar.gz"
sha256 = "152e66e940ba4d17eebf04cdb973de25b1c5843612e51ebcbd4264065b806c8a"

