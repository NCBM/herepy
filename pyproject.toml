[tool.basedpyright]
typeCheckingMode = "recommended"
exclude = ["runs"]
ignore = [
    "src/main",
    "src/herecraft/_vendor",
    "runs",
    "gradle",
    "build",
    "typings"
]
extraPaths = ["runs/client/python/typings", "src"]
reportAny = "hint"
reportExplicitAny = "hint"
reportImportCycles = "hint"
reportMissingModuleSource = "hint"

[tool.ruff]
line-length = 120
target-version = "py312"
# Vendored code is copied verbatim and is not this project's to reformat (see src/herecraft/_vendor).
extend-exclude = ["src/herecraft/_vendor"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
exclude = ["typings/**/*"]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "I",     # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "SIM",   # flake8-simplify
  "TID",   # flake8-tidy-imports
  "PLE",   # Pylint errors
  "NPY",   # NumPy-specific rules
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "B008",   # function-call-in-default-argument
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "RUF019",
  "T201",
  "UP035",
  # duplicate with basedpyright
  "B007",
]

[tool.ruff.lint.isort]
length-sort = false
force-sort-within-sections = true
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
